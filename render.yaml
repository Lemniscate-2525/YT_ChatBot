# Render deployment blueprint - Free-tier optimized (0 cost)
services:
  - type: web
    name: yt-chatbot-api
    runtime: python
    plan: free
    buildCommand: pip install -r req.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CHROMA_DIR
        value: chroma_db
      - key: KNOWLEDGE_GRAPH_PATH
        value: data/knowledge_graph.json
      - key: ENABLE_API_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RAG_API_KEY
        generateValue: true
      - key: TRANSCRIPT_WORKER_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
